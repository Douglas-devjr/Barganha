name: Cobertura do típico na compra (medição)

# C8.4.1 — Vigia o gatilho da UI de "economia real" (pagou × típico, docs/06).
#
# Por que existe: o gatilho dessa UI é uma MEDIÇÃO, não uma data — mediana da
# fração de itens com típico gravado passando de 60% num cupom típico. Medição
# que ninguém roda não dispara nada: sem este cron, descobrir que a cobertura
# cruzou o limiar dependeria de alguém LEMBRAR de rodar o job meses depois.
#
# O que este workflow NÃO faz: decidir. Ele avisa que a condição de entrada foi
# satisfeita; construir a UI continua sendo decisão humana. Quando ela for
# entregue, virar `UI_ECONOMIA_REAL_ENTREGUE` para `true` no mesmo commit —
# senão o aviso volta todo mês (o gatilho, uma vez cruzado, não se desarma).
#
# Requer os segredos de repositório SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY.
# ALERTA_WEBHOOK_URL (Discord/Slack) é opcional: sem ele o aviso fica no log e
# no resumo desta execução, que continuam consultáveis aqui.

on:
  schedule:
    # Mensal (dia 1º, 05:30 UTC — meia hora depois da calibração, para as duas
    # varreduras de catálogo não competirem pelo mesmo free tier).
    - cron: '30 5 1 * *'
  workflow_dispatch:

concurrency:
  group: cobertura-tipico
  cancel-in-progress: false

jobs:
  cobertura:
    name: Medir a cobertura do típico contra o banco real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALERTA_WEBHOOK_URL: ${{ secrets.ALERTA_WEBHOOK_URL }}
    steps:
      - name: Falha cedo se faltar credencial do Supabase
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: |
          echo "::error::Segredos SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY ausentes — configure em Settings → Secrets."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      # O resultado vai para o RESUMO da execução, não só para o log: um job
      # mensal cujo número exige abrir o passo e rolar a saída é um job que
      # ninguém lê. Sai 0 com o gatilho ainda não atingido — é resposta válida,
      # não falha, e build vermelho todo mês vira ruído ignorado.
      - name: Mede a cobertura e publica o resultado
        # `shell: bash` traz `pipefail`: sem ele o código de saída do pipe seria
        # o do `tee`, e uma falha real do job passaria como verde.
        shell: bash
        run: |
          {
            echo '### Cobertura do típico na compra'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run job:cobertura-tipico --workspace @barganha/backend 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo ''
            echo '_Só medição — construir a UI de "economia real" é decisão humana._'
          } >> "$GITHUB_STEP_SUMMARY"
